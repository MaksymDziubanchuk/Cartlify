name: DB — run SQL script (manual)

on:
  workflow_dispatch:
    inputs:
      target_db:
        description: 'target database'
        required: true
        type: choice
        options:
          - dev
          - prod

      sql_file:
        description: 'sql file under db/'
        required: true
        type: choice
        options:
          # keep this list in sync with /db/schema/*.sql
          - db/schema/01_roles_and_schemas.sql
          - db/schema/02_extensions.sql
          - db/schema/03_policies_and_rls.sql
          - db/schema/04_views.sql
          - db/schema/05_fn_and_triggers.sql
          - db/schema/06_indexes_and_constraints.sql
          # db/data/* (the clear scripts) wipe data: they are run only by hand from a local machine,
          # never through this workflow, on dev neither

concurrency:
  # prevent parallel db mutations per target
  group: db-sql-${{ inputs.target_db }}
  cancel-in-progress: false

jobs:
  run_sql:
    runs-on: ubuntu-latest

    # prod only from develop, the branch its migrations come from too
    if: inputs.target_db != 'prod' || github.ref == 'refs/heads/develop'

    # the github environment of the target: the prod one asks a reviewer to approve the run
    # (Settings -> Environments -> prod -> Required reviewers)
    environment: ${{ inputs.target_db }}

    steps:
      # get repo files so runner can access db scripts; nothing connects before the masking
      - name: Checkout repo
        uses: actions/checkout@v7

      # the repo is public and so are its logs: psql and prisma print parts of a database
      # address, github hides only whole secrets; every part is masked before anything connects
      - name: Mask database addresses
        env:
          DB_URLS: ${{ secrets.DEV_DB_URL }} ${{ secrets.PROD_DB_URL }} ${{ secrets.PROD_MIGRATION_DATABASE_URL }}
        run: bash .github/scripts/mask-db-urls.sh

      # install psql client for executing postgres scripts
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # validate selected file to avoid path traversal and weird shell tricks
      - name: Validate selected file
        run: |
          set -euo pipefail

          SCRIPT="${{ inputs.sql_file }}"

          # allow only .sql files
          case "$SCRIPT" in
            *.sql) ;;
            *) echo "only .sql files are allowed"; exit 1 ;;
          esac

          # block path traversal
          if echo "$SCRIPT" | grep -q '\.\.'; then
            echo "path traversal is not allowed"
            exit 1
          fi

          # allow only safe characters
          if echo "$SCRIPT" | grep -Eq '[^a-zA-Z0-9._/\-]'; then
            echo "invalid characters in script path"
            exit 1
          fi

          # restrict scripts to db/ folder
          case "$SCRIPT" in
            db/*) ;;
            *) echo "only scripts under db/ are allowed"; exit 1 ;;
          esac

          # the data scripts wipe a database, they run only by hand from a local machine
          case "$SCRIPT" in
            db/data/*) echo "db/data scripts are not run by this workflow"; exit 1 ;;
          esac

          # require file to exist
          if [ ! -f "$SCRIPT" ]; then
            echo "file not found: $SCRIPT"
            echo "available sql files under db/:"
            find db -maxdepth 3 -type f -name "*.sql" -print
            exit 1
          fi

          echo "script ok: $SCRIPT"

      # name the target before executing mutations, to reduce human mistakes; the database
      # name and the user are masked, so the step names the input and checks the connection
      - name: Show db target info
        env:
          DEV_URL: ${{ secrets.DEV_DB_URL }}
          PROD_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          set -euo pipefail

          if [ "${{ inputs.target_db }}" = "dev" ]; then
            URL="$DEV_URL"
          else
            URL="$PROD_URL"
          fi

          psql -v ON_ERROR_STOP=1 -tAc "select 1" "$URL" > /dev/null
          echo "target: ${{ inputs.target_db }}, script: ${{ inputs.sql_file }}, connection ok"

      # run selected sql on dev db; a script waits at most 5 s for a busy table (lock_timeout)
      # and rolls back, so it runs again, up to 3 times
      - name: Run script on DEV
        if: inputs.target_db == 'dev'
        env:
          DATABASE_URL: ${{ secrets.DEV_DB_URL }}
        run: bash .github/scripts/run-sql-with-retry.sh "${{ inputs.sql_file }}"

      # run selected sql on prod db; a script waits at most 5 s for a busy table (lock_timeout)
      # and rolls back, so it runs again, up to 3 times
      - name: Run script on PROD
        if: inputs.target_db == 'prod'
        env:
          DATABASE_URL: ${{ secrets.PROD_DB_URL }}
        run: bash .github/scripts/run-sql-with-retry.sh "${{ inputs.sql_file }}"

      # node and prisma client are needed only for the structure check below
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # read-only: compare database structure with db/tools/structure_snapshot.txt
      # red means a script was not run on this database yet or it was changed by hand
      - name: Compare DEV structure with the reference
        if: inputs.target_db == 'dev'
        env:
          DATABASE_URL: ${{ secrets.DEV_DB_URL }}
        run: npm run db:snapshot:check:db

      - name: Compare PROD structure with the reference
        if: inputs.target_db == 'prod'
        env:
          DATABASE_URL: ${{ secrets.PROD_DB_URL }}
        run: npm run db:snapshot:check:db

  deny_prod_from_other_branches:
    name: Deny prod runs outside develop
    runs-on: ubuntu-latest
    if: inputs.target_db == 'prod' && github.ref != 'refs/heads/develop'
    steps:
      - run: |
          echo "SQL on prod may only run from the develop branch."
          exit 1
