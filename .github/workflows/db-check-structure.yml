name: DB — check structure against reference (manual)

# read-only: compares a database with db/tools/structure_snapshot.txt
# use it after a script was run by hand through psql (db/schema/01, db/schema/02)

on:
  workflow_dispatch:
    inputs:
      target_db:
        description: 'target database'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  check_structure:
    runs-on: ubuntu-latest

    steps:
      # get repo files so runner can access the reference and the snapshot script
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # red means a script was not run on this database yet or it was changed by hand
      - name: Compare DEV structure with the reference
        if: inputs.target_db == 'dev'
        env:
          DATABASE_URL: ${{ secrets.DEV_DB_URL }}
        run: npm run db:snapshot:check:db

      - name: Compare PROD structure with the reference
        if: inputs.target_db == 'prod'
        env:
          DATABASE_URL: ${{ secrets.PROD_DB_URL }}
        run: npm run db:snapshot:check:db
