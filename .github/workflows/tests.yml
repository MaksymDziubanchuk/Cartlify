name: Tests

# unit and integration tests; integration parts run against the docker test database
# that npm test builds on the runner (docker-compose.test.yml), no real database is touched

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      parts:
        description: 'test parts and real services, for example: unit api:users service:sendgrid service:cloudinary service:stripe service:openai (empty runs all parts, services from their mocks)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

# a newer push to the same branch makes the older run pointless
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # with service:cloudinary in parts the cloudinary tests upload to the real account (its test/
      # folder); the repo is public and so are its logs, github hides only the whole secret: its
      # parts are masked before anything runs. Without the secret service:cloudinary stops the run
      - name: Mask Cloudinary key parts
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: |
          if [ -n "$CLOUDINARY_URL" ]; then
            rest="${CLOUDINARY_URL#*://}"
            key="${rest%%:*}"; rest="${rest#*:}"
            secret="${rest%%@*}"; cloud="${rest#*@}"; cloud="${cloud%%[/?#]*}"
            for part in "$key" "$secret" "$cloud"; do
              if [ -n "$part" ]; then echo "::add-mask::$part"; fi
            done
          fi

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # postinstall in package.json generates the prisma client
      - name: Install dependencies
        run: npm ci

      # the tests only transpile (isolatedModules), a type error would reach main and break only
      # the build on railway
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # node runs the built server (npm start): an alias import the build left would not resolve.
      # Under tsx such an import loaded a second copy of the module from src/
      - name: Check the build has no alias imports
        run: |
          if grep -rElq "(from|import\()\s*['\"](@(services|middlewares|config|utils|routes|schemas|helpers|redis|db)/|types/)" dist; then
            grep -rEl "(from|import\()\s*['\"](@(services|middlewares|config|utils|routes|schemas|helpers|redis|db)/|types/)" dist
            echo "the build left alias imports in dist"
            exit 1
          fi

      # the packages the server runs with; development tools stay out (npm audit --omit=dev)
      - name: Audit server dependencies
        run: npm audit --omit=dev --audit-level=high

      # the files jest transformed in an earlier run (jest.config.js, cacheDirectory); npm ci
      # empties node_modules, so it comes back after the install. A file that changed is
      # transformed again, jest checks the content of each one
      - name: Restore the jest cache
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.js', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.js', 'tsconfig*.json') }}-

      # no terminal here, so the launcher runs every part unless parts are given, and the services
      # of tests/run.mjs (sendgrid, cloudinary, stripe, openai) answer from their mocks unless parts
      # name them (service:sendgrid, service:cloudinary, service:stripe, service:openai).
      # Real Stripe takes the key of its test sandbox, real OpenAI its test key, one value each that
      # github masks whole; a real service without its secret stops the run. Real SendGrid takes its
      # test key and the addresses of the authenticated domain, each a secret github masks whole;
      # every mail goes in sandbox mode, none is delivered
      - name: Run tests
        env:
          PARTS: ${{ inputs.parts }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          OPENAI_API_TEST_KEY: ${{ secrets.OPENAI_API_TEST_KEY }}
          SENDGRID_API_TEST_KEY: ${{ secrets.SENDGRID_API_TEST_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
        run: npm test -- $PARTS

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: tests/coverage/lcov-report
          if-no-files-found: ignore
