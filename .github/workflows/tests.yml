name: Tests

# unit and integration tests; integration parts run against the docker test database
# that npm test builds on the runner (docker-compose.test.yml), no real database is touched

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      parts:
        description: 'test parts, for example: unit api:orders (empty runs all)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

# a newer push to the same branch makes the older run pointless
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # the cloudinary tests upload to the real account (its test/ folder); the repo is public and
      # so are its logs, github hides only the whole secret: its parts are masked before anything
      # runs. Without the secret the cloudinary tests are skipped
      - name: Mask Cloudinary key parts
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: |
          if [ -n "$CLOUDINARY_URL" ]; then
            rest="${CLOUDINARY_URL#*://}"
            key="${rest%%:*}"; rest="${rest#*:}"
            secret="${rest%%@*}"; cloud="${rest#*@}"; cloud="${cloud%%[/?#]*}"
            for part in "$key" "$secret" "$cloud"; do
              if [ -n "$part" ]; then echo "::add-mask::$part"; fi
            done
          fi

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # postinstall in package.json generates the prisma client
      - name: Install dependencies
        run: npm ci

      # the files jest transformed in an earlier run (jest.config.js, cacheDirectory); npm ci
      # empties node_modules, so it comes back after the install. A file that changed is
      # transformed again, jest checks the content of each one
      - name: Restore the jest cache
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.js', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.js', 'tsconfig*.json') }}-

      # no terminal here, so the launcher runs every part unless parts are given. The payment tests
      # take the key of the Stripe test sandbox, one value that github masks whole; without the
      # secret they are skipped
      - name: Run tests
        env:
          PARTS: ${{ inputs.parts }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: npm test -- $PARTS

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: tests/coverage/lcov-report
          if-no-files-found: ignore
