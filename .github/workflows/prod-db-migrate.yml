name: PROD DB — Prisma migrate deploy (develop only)

on:
  workflow_dispatch:

concurrency:
  group: prod-db-migrations
  cancel-in-progress: false

jobs:
  migrate_prod:
    name: Apply Prisma migrations to PROD database
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/develop'

    steps:
      # the repo is public and so are its logs: prisma prints the database host,
      # github hides only whole secrets, so the host is masked before anything connects
      - name: Mask database host
        env:
          DB_URLS: ${{ secrets.PROD_MIGRATION_DATABASE_URL }}
        run: |
          for url in $DB_URLS; do
            host="${url#*://}"; host="${host##*@}"; host="${host%%[:/?]*}"
            if [ -n "$host" ]; then echo "::add-mask::$host"; fi
          done

      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma migrate status (PROD)
        run: npx prisma migrate status || true
        env:
          DATABASE_URL: ${{ secrets.PROD_MIGRATION_DATABASE_URL }}

      - name: Prisma migrate deploy (PROD)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_MIGRATION_DATABASE_URL }}

  deny_non_develop:
    name: Deny run on non-develop branches
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/develop'
    steps:
      - run: |
          echo "This workflow may only run from the develop branch."
          exit 1
