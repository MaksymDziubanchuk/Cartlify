name: PROD DB — Prisma migrate deploy (develop only)

on:
  workflow_dispatch:

concurrency:
  group: prod-db-migrations
  cancel-in-progress: false

jobs:
  migrate_prod:
    name: Apply Prisma migrations to PROD database
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/develop'

    # a reviewer approves every change of prod (Settings -> Environments -> prod)
    environment: prod

    steps:
      # nothing connects before the masking below
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop

      # the repo is public and so are its logs: prisma prints parts of the database address,
      # github hides only whole secrets; every part is masked before anything connects
      - name: Mask database address
        env:
          DB_URLS: ${{ secrets.PROD_MIGRATION_DATABASE_URL }}
        run: bash .github/scripts/mask-db-urls.sh

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma migrate status (PROD)
        run: npx prisma migrate status || true
        env:
          DATABASE_URL: ${{ secrets.PROD_MIGRATION_DATABASE_URL }}

      - name: Prisma migrate deploy (PROD)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_MIGRATION_DATABASE_URL }}

  deny_non_develop:
    name: Deny run on non-develop branches
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/develop'
    steps:
      - run: |
          echo "This workflow may only run from the develop branch."
          exit 1
