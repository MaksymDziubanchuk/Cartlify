# weekly pull requests with updates into develop, where tests.yml checks them
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # one pull request for the small updates, every major update on its own
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # ts-jest and typescript-eslint support typescript up to 6.x
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # the types follow the major version of node the server runs on (engines in package.json):
      # newer ones describe what node 24 has not; they change together with node
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    # a package with an install script in allowScripts (package.json) needs
    # npm install-scripts approve <package> after its update

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
