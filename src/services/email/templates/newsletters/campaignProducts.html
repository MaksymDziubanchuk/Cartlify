<tr>
  <td style="padding:12px 0 0 0;font-family:Arial,Helvetica,sans-serif;">
    {{#title}}<div style="font-size:18px;font-weight:800;color:#2e1065;margin:0 0 12px 0;">{{title}}</div>{{/title}}
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
      {{#cards}}<tr>
        <td width="96" valign="top" style="padding:0 14px 16px 0;">
          {{#imageUrl}}<a href="{{url}}"><img src="{{imageUrl}}" alt="{{name}}" width="96" style="display:block;width:96px;height:auto;border:0;"></a>{{/imageUrl}}
        </td>
        <td valign="top" style="padding:0 0 16px 0;font-size:14px;color:#111827;line-height:1.5;">
          <a href="{{url}}" style="color:#111827;font-weight:700;text-decoration:none;">{{name}}</a>
          <div style="margin:2px 0 0 0;">{{#salePrice}}<strong>{{salePrice}}</strong> <s style="color:#6b7280;">{{price}}</s>{{/salePrice}}{{^salePrice}}{{price}}{{/salePrice}}</div>
          {{#untilLine}}<div style="font-size:12px;color:#6b7280;margin:2px 0 0 0;">{{untilLine}}</div>{{/untilLine}}
          {{#priorLine}}<div style="font-size:12px;color:#6b7280;margin:2px 0 0 0;">{{priorLine}}</div>{{/priorLine}}
        </td>
      </tr>{{/cards}}
    </table>
  </td>
</tr>
