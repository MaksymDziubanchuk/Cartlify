<tr>
  <td style="padding:12px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#111827;line-height:1.5;">
    {{#title}}<div style="font-size:18px;font-weight:800;color:#2e1065;margin:0 0 12px 0;">{{title}}</div>{{/title}}
    {{#imageUrl}}<a href="{{url}}"><img src="{{imageUrl}}" alt="{{name}}" width="288" style="display:block;max-width:288px;width:100%;height:auto;border:0;margin:0 0 8px 0;"></a>{{/imageUrl}}
    <a href="{{url}}" style="color:#111827;font-weight:700;text-decoration:none;">{{name}}</a>
    <div style="padding:8px 0 4px 0;"><a href="{{url}}" style="color:#6d28d9;text-decoration:underline;">{{label}}</a></div>
  </td>
</tr>
